<!doctype html>
<html lang="pt-BR" class="dark theme-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JH7 Gestão de Estúdios Fotográficos</title>
    <meta name="description" content="SaaS para gestão de estúdios fotográficos e fotógrafos." />
    <meta name="author" content="JH7 Gestão de Estúdios Fotográficos" />
    <meta property="og:title" content="JH7 Gestão de Estúdios Fotográficos" />
    <meta
      property="og:description"
      content="SaaS para gestão de estúdios fotográficos e fotógrafos."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <script>
      // Aplica a preferência de tema antes da primeira pintura (sem flash)
      (function () {
        try {
          var t = localStorage.getItem("jh7:theme");
          if (t === "light") {
            var r = document.documentElement;
            r.classList.remove("dark", "theme-dark");
            r.classList.add("theme-light");
            r.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
